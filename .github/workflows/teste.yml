# Every pull request and every push to main: the backend tests (xUnit, PostgreSQL in Testcontainers), the frontend checks
# (lint, Vitest, build), the browser tests (Playwright, one job per browser: Chromium, Firefox, WebKit, against a throwaway test API) and
# a stress test of the API (tools/MarkAi.Stres; its statistics go on the run's summary page, it never fails the build). No secrets are
# needed: every test uses fake email, SMS, AI and Twilio providers.
name: Teste

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: teste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: database/global.json
      - name: Teste unit și de integrare
        working-directory: database
        run: dotnet test

  frontend:
    name: Frontend (lint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:optimizare
        working-directory: frontend
      - name: next build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
      - name: Browser pentru previzualizare și încărcare (fără bază de date)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Previzualizare, progres, anulare și reîncercare
        working-directory: frontend
        run: npx playwright test --config playwright.upload.config.ts

  e2e:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each browser gets its own job: they run side by side and a failure in one doesn't cancel the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # WebKit is new in CI: its failures show up but don't fail the run until it has passed a few times.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: database/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Browserele Playwright (din cache când versiunea nu s-a schimbat)
        id: browsere
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.browsere.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - if: steps.browsere.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
        working-directory: frontend
      - name: Testele din browser
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

  stres:
    name: Stres (API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Shared runners vary in speed from run to run: the numbers go on the run's summary page, but a slow run doesn't fail the build.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: stres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MARKAI_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=stres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: database/global.json
      - name: Baza de test (cu datele de volum, ca API-ul să răspundă din liste reale)
        working-directory: database
        run: for pas in migrate seed-localitati seed date-volum; do dotnet run --project tools/MarkAi.Database -- $pas > /dev/null; done
      - name: API-ul de test (limite ridicate, ca să se măsoare API-ul, nu limitatorul)
        working-directory: database
        run: |
          export MARKAI_JWT_KEY=$(openssl rand -base64 48) Email__Furnizor=jurnal Sms__Furnizor=jurnal ASPNETCORE_URLS=http://127.0.0.1:5082 \
            Limite__CereriPeMinut=1000000 Limite__AutentificariPeMinut=1000000
          dotnet build src/MarkAi.Api -c Release
          nohup dotnet run --project src/MarkAi.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5082/judete && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Testul de stres (statisticile apar la final și pe pagina rulării)
        working-directory: database
        # Logins check a password hash on purpose (slow by design: ~100/s on a laptop), so they only get a burst of 100; at 500+
        # they would fail on any machine and the job would be red on every run. Both parts always run; the step fails if either does.
        run: |
          STRES="dotnet run --project tools/MarkAi.Stres -c Release -- --url http://127.0.0.1:5082 --clienti 100 --rezumat $GITHUB_STEP_SUMMARY"
          rc=0
          $STRES --scenarii materii,judete,organizatii,profesori,lectii,lectie,cautare,progres,eu,mix --cereri 100,500,1000 --rata 200 --durata 15 || rc=1
          $STRES --scenarii autentificare --cereri 100 || rc=1
          exit $rc
      - if: failure()
        name: Jurnalul API-ului
        run: tail -n 200 database/api.log
