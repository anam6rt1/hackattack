# Every pull request and every push to main: the backend tests (xUnit, PostgreSQL in Testcontainers), the frontend checks
# (lint, Vitest, build) and the browser tests (Playwright, Chromium + Firefox, against a throwaway test API). No secrets are
# needed: every test uses fake email, SMS, AI and Twilio providers.
name: Teste

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: teste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: database/global.json
      - name: Teste unit și de integrare
        working-directory: database
        run: dotnet test

  frontend:
    name: Frontend (lint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: next build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: database/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Browserele Playwright (din cache când versiunea nu s-a schimbat)
        id: browsere
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.browsere.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - if: steps.browsere.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox
        working-directory: frontend
      - name: Testele din browser
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
